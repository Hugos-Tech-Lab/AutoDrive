name: Build Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write # Required to push images to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: auto-drive-cloud
            image: auto-drive-cloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Sets the build context to the specific folder
          context: ./${{ matrix.folder }}
          push: true
          # Tags the image with 'latest' and the specific Git commit SHA
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          # Utilizes GitHub Actions cache to speed up future builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
