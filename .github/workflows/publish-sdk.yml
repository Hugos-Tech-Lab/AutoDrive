name: Publish Rust SDK

on:
  push:
    tags:
      - 'sdk/v*'

permissions:
  contents: write

jobs:
  publish-crate:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-drive-sdk-rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Ensure WASM Target is active
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate Tag matches all Workspace Crate Versions & External WASM SDK
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#sdk/v}
          echo "Target Git Tag Version: $TAG_VERSION"

          MISMATCH_FOUND=false

          WASM_SDK_PATH="../firmware/the-beginner-car-v1-wasm-firmware/api/the-beginner-car-wasm-sdk"
          if [ -d "$WASM_SDK_PATH" ]; then
            WASM_VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path "$WASM_SDK_PATH/Cargo.toml" | jq -r '.packages[0].version')
            echo "Checking crate 'the-beginner-car-wasm-sdk' (v$WASM_VERSION)..."

            if [ "$WASM_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Crate 'the-beginner-car-wasm-sdk' version ($WASM_VERSION) does not match Git tag ($TAG_VERSION)"
              MISMATCH_FOUND=true
            fi
          else
            echo "::error::Directory '$WASM_SDK_PATH' not found!"
            MISMATCH_FOUND=true
          fi

          while IFS= read -r line; do
            NAME=$(echo "$line" | jq -r '.name')
            VERSION=$(echo "$line" | jq -r '.version')

            echo "Checking crate '$NAME' (v$VERSION)..."

            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Crate '$NAME' version ($VERSION) does not match Git tag ($TAG_VERSION)"
              MISMATCH_FOUND=true
            fi
          done < <(cargo metadata --no-deps --format-version 1 | jq -c '.workspace_members[] as $id | .packages[] | select(.id == $id)')

          if [ "$MISMATCH_FOUND" = true ]; then
            exit 1
          fi

          echo "Crates match $TAG_VERSION!"

      - name: Publish WASM SDK Dependency
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --manifest-path ../firmware/the-beginner-car-v1-wasm-firmware/api/the-beginner-car-wasm-sdk/Cargo.toml --target wasm32-unknown-unknown --no-verify
          
          TAG_VERSION=${GITHUB_REF_NAME#sdk/v}
          echo "Waiting for the-beginner-car-wasm-sdk v$TAG_VERSION to be indexable on Crates.io..."
          
          for i in {1..12}; do
            cargo check && break || sleep 10
          done

      - name: Publish Workspace Crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rust SDK ${{ github.ref_name }}
          generate_release_notes: true