[package]
name = "auto-drive-cloud"
version = "0.1.0"
edition = "2024"

[features]
default = ["development"]
development = []
production = []

[dependencies]
auto-drive-common-types = { path = "../firmware/the-beginner-car-v1-wasm-firmware/api/auto-drive-common-types" }

prost = "0.14"
tonic = "0.14.6"
tonic-prost = "0.14.6"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = [
  "net",
  "io-util",
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
warp = { version = "0.4.3", features = ["server", "multipart"] }
bytes = "1.12.1"
futures-util = "0.3.34"
serde_json = "1.0.154"
log = "0.4.34"
env_logger = "0.11.11"

[build-dependencies]
tonic-prost-build = "0.14.6"
