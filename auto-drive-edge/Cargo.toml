[package]
name = "auto-drive-edge"
version = "0.1.0"
edition = "2024"

[dependencies]
the-beginner-car-tcp-protocol = { path = "../firmware/the-beginner-car-wifi-firmware/api/the-beginner-car-tcp-protocol" }
gilrs = { version = "0.11.2", default-features = false, features = [
  "xinput",
] } # TODO: remove this
metrics = "0.24.6"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = [
  "net",
  "io-util",
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
opentelemetry-otlp = { version = "0.33.1", features = [
  "grpc-tonic",
  "trace",
  "metrics",
] }
warp = { version = "0.4.3", features = ["server"] }
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
bytes = "1.12.1"
futures-util = "0.3"
prost = "0.14"
tonic = "0.14.6"
tonic-prost = "0.14.6"
uuid = { version = "1.28.0", features = ["v4"] }
sha2 = "0.11.1"
hex = "0.4.3"
chrono = "0.4.45"
log = "0.4.34"

[build-dependencies]
tonic-prost-build = "0.14.6"
