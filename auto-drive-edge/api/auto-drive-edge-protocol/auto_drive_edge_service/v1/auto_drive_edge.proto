syntax = "proto3";

package auto_drive_edge_service.v1;

service AutoDriveEdgeService {
  // =======================
  // ==== FOR THE CLOUD ====
  // =======================
  // Non specific target
  rpc GetVehicles(GetVehiclesRequest) returns (GetVehiclesResponse);
  rpc WatchAutoScripts(WatchAutoScriptsRequest) returns (stream WatchAutoScriptsResponse);

  // Script specific
  rpc EnqueueAutoScript(EnqueueAutoScriptRequest) returns (EnqueueAutoScriptResponse);
  rpc RunAutoScript(RunAutoScriptRequest) returns (RunAutoScriptResponse);
  rpc CancelAutoScript(CancelAutoScriptRequest) returns (CancelAutoScriptResponse);
  rpc WatchAutoScriptLogs(WatchAutoScriptLogsRequest) returns (stream WatchAutoScriptLogsResponse);

  // Vehicle Specific
  rpc WatchVehicleLogs(WatchVehicleLogsRequest) returns (stream WatchVehicleLogsResponse);
  rpc WatchHardwareStatus(WatchHardwareStatusRequest) returns (stream WatchHardwareStatusResponse);
  rpc WatchHardwarePose(WatchHardwarePoseRequest) returns (stream WatchHardwarePoseResponse);

  // ==============================
  // ==== FOR THE RASPBERRY PI ====
  // ==============================
  rpc NotifyHardwareCoordinates(NotifyHardwareCoordinatesRequest) returns (NotifyHardwareCoordinatesResponse);
}

message GetVehiclesRequest {}

message GetVehiclesResponse {
  repeated string number_plates = 1;
}

message WatchAutoScriptsRequest {}

message WatchAutoScriptsResponse {
  repeated AutoScript scripts = 1;
}

// LogMessage

message WatchVehicleLogsRequest {
  string number_plate = 1;
  //
}

message WatchVehicleLogsResponse {
  LogMessage log_message = 1;
}

message HardwareCoordinate {
  uint32 aruco_marker_id = 1;
  float x = 2;
  float y = 3;
  float rotation_radians = 4;
  uint64 timestamp_unix_epoch_ms = 5;
}

message WatchHardwarePoseRequest {
  string number_plate = 1;
}

message WatchHardwarePoseResponse {
  string number_plate = 1;
  float x = 2;
  float y = 3;
  float rotation_radians = 4;
  uint64 timestamp_unix_epoch_ms = 5;
}

message NotifyHardwareCoordinatesRequest {
  repeated HardwareCoordinate hardware_coordinates = 1;
}

message NotifyHardwareCoordinatesResponse {}

message WatchHardwareStatusRequest {}

message WatchHardwareStatusResponse {
  repeated Hardware hardware = 1;
}

message Hardware {
  string number_plate = 1;
  string category = 2;
  bool is_connected = 3;
}

message AutoScript {
  string owner_name = 1;
  string owner_comment = 2;
  string uploaded_script_hash = 3;
  string script_queue_time = 4;
  optional string script_start_time = 5;
  optional string vehicle_start_time = 6;
  optional string vehicle_finish_time = 7;
  optional string script_stop_time = 8;
  optional string number_plate = 9;
  uint32 run_number = 10;
  string run_uuid = 11;
  AutoScriptType script_type = 12;
  AutoScriptLifecycle lifecycle = 13;
  AutoScriptRuntimeLifecycle runtime_lifecycle = 14;
}

enum AutoScriptType {
  AUTO_SCRIPT_TYPE_UNSPECIFIED = 0;
  AUTO_SCRIPT_TYPE_TIME_TRIALS = 1;
  AUTO_SCRIPT_TYPE_REPOSITION = 2;
  AUTO_SCRIPT_TYPE_CONFIG_ADJUST = 3;
}

enum AutoScriptLifecycle {
  AUTO_SCRIPT_LIFECYCLE_UNSPECIFIED = 0;
  AUTO_SCRIPT_LIFECYCLE_IDLE = 1;
  AUTO_SCRIPT_LIFECYCLE_SENDING_TO_WIFI_MCU = 2;
  AUTO_SCRIPT_LIFECYCLE_RECEIVED_BY_WIFI_MCU = 3;
  AUTO_SCRIPT_LIFECYCLE_SENDING_TO_WASM_MCU = 4;
  AUTO_SCRIPT_LIFECYCLE_RECEIVED_BY_WASM_MCU = 5;
  AUTO_SCRIPT_LIFECYCLE_STARTED_CALLING_MAIN = 6;
  AUTO_SCRIPT_LIFECYCLE_CANCELLING = 7;
  AUTO_SCRIPT_LIFECYCLE_STOPPED_BY_SCRIPT_END = 8;
  AUTO_SCRIPT_LIFECYCLE_STOPPED_BY_SAFETY = 9;
  AUTO_SCRIPT_LIFECYCLE_STOPPED_BY_HTTP_CANCEL = 10;
  AUTO_SCRIPT_LIFECYCLE_STOPPED_BY_DISCONNECT = 11;
}

message WatchAutoScriptLogsRequest {
  string run_uuid = 1;
}

message WatchAutoScriptLogsResponse {
  LogMessage log_message = 1;
}

message EnqueueAutoScriptRequest {
  string owner_name = 1;
  string owner_comment = 2;
  bytes data = 3;
  AutoScriptType script_type = 4;
}

message EnqueueAutoScriptResponse {
  string run_uuid = 1;
}

message RunAutoScriptRequest {
  string run_uuid = 1;
  string number_plate = 2;
}

message RunAutoScriptResponse {}

message CancelAutoScriptRequest {
  string run_uuid = 1;
}

message CancelAutoScriptResponse {}

message WatchTheBeginnerCarEventsRequest {
  string number_plate = 1;
}

message SystemStateEvent {}

message MotorSpeedUpdatedEvent {
  // Rust i8 is represented as int32 in protobuf.
  // Validate the range -128..127 in your application.
  int32 speed = 1;
}

message WasmInstalledEvent {}

message AutoScriptRunningEvent {}

message AutoScriptStoppedEvent {}

message InfraredLedReadingsEvent {
  uint32 front_far_left = 1;
  uint32 front_left = 2;
  uint32 front_center = 3;
  uint32 front_right = 4;
  uint32 front_far_right = 5;
  uint32 back_center = 6;
  uint32 back_left = 7;
}

message BatteryReadingEvent {
  float battery_voltage = 1;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_ERROR = 1;
  LOG_LEVEL_WARN = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_DEBUG = 4;
  LOG_LEVEL_TRACE = 5;
}

enum LogSystemOrigin {
  LOG_SYSTEM_ORIGIN_WASM_UNSPECIFIED = 0;
  LOG_SYSTEM_ORIGIN_WASM_MCU = 1;
  LOG_SYSTEM_ORIGIN_WIFI_MCU = 2;
}

message LogMessage {
  LogSystemOrigin system_origin = 1;
  LogLevel level = 2;
  string message = 3;
}
