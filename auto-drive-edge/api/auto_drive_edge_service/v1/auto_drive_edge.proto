syntax = "proto3";

package auto_drive_edge_service.v1;

service AutoDriveEdgeService {
  rpc RunAutoScript(RunAutoScriptRequest) returns (RunAutoScriptResponse);

  rpc WatchTheBeginnerCarEvents(WatchTheBeginnerCarEventsRequest) returns (stream WatchTheBeginnerCarEventsResponse);
}

message RunAutoScriptRequest {
  TheBeginnerCarBuild build = 1;
  bytes data = 2;
}

message RunAutoScriptResponse {}

message WatchTheBeginnerCarEventsRequest {}

enum TheBeginnerCarBuild {
  THE_BEGINNER_CAR_BUILD_UNSPECIFIED = 0;
  THE_BEGINNER_CAR_BUILD_A = 1;
  THE_BEGINNER_CAR_BUILD_B = 2;
}

message WatchTheBeginnerCarEventsResponse {
  oneof event {
    LogEvent log = 1;
    SystemStateEvent system_state = 2;
    MotorSpeedUpdatedEvent motor_a_speed_updated = 3;
    MotorSpeedUpdatedEvent motor_b_speed_updated = 4;
    WasmInstalledEvent wasm_installed = 5;
    AutoScriptRunningEvent auto_script_running = 6;
    AutoScriptStoppedEvent auto_script_stopped = 7;
    BatteryReadingEvent battery_reading = 8;
    IRSensorAReadingEvent ir_sensor_a_reading = 9;
  }
}

message LogEvent {
  LogMessage log = 1;
}

message SystemStateEvent {}

message MotorSpeedUpdatedEvent {
  // Rust i8 is represented as int32 in protobuf.
  // Validate the range -128..127 in your application.
  int32 speed = 1;
}

message WasmInstalledEvent {}

message AutoScriptRunningEvent {}

message AutoScriptStoppedEvent {}

message BatteryReadingEvent {
  float motor_battery_voltage = 1;
  float mcu_battery_voltage = 2;
}

message IRSensorAReadingEvent {
  uint32 value = 1;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_ERROR = 1;
  LOG_LEVEL_WARN = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_DEBUG = 4;
  LOG_LEVEL_TRACE = 5;
}

message LogMessage {
  string message = 1;
  LogLevel level = 2;
}
