[workspace]
members = ["auto-drive-sdk", "auto-drive-sdk-macros"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
auto-drive-sdk-macros = { path = "auto-drive-sdk-macros", version = "0.0.2" }
the-beginner-car-wasm-sdk = { path = "../firmware/the-beginner-car-v1-wasm-firmware/api/the-beginner-car-wasm-sdk", version = "0.0.2" }

[profile.dev]
opt-level = "z"      # Optimize strictly for size
lto = true           # Enable Link-Time Optimization across all crates
codegen-units = 1    # Reduce parallel compilation blocks to maximize LTO stripping
panic = "abort"      # Remove heavy stack unwinding tracking structures

[profile.release]
opt-level = "z"      # Optimize strictly for size
lto = true           # Enable Link-Time Optimization across all crates
codegen-units = 1    # Reduce parallel compilation blocks to maximize LTO stripping
panic = "abort"      # Remove heavy stack unwinding tracking structures
