[package]
name = "auto-drive-sdk-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "The AutoDrive SDK runner uploads your script to the car and then monitors it."

[dependencies]
tokio = { version = "1.32", features = ["full"] }
reqwest = { version = "0.11", features = ["stream", "multipart", "json"] }
serde_json = "1.0"
futures-util = "0.3"
