[package]
name = "auto-drive-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "The AutoDrive SDK is a library providing functionality to write programs that would be uploaded onto small vehicles in the lab."

[dependencies]
auto-drive-sdk-macros.workspace = true
the-beginner-car-wasm-sdk.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "auto-drive"
path = "src/main.rs"

