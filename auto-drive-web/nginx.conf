# ===== AUTODRIVE =====

server {
    listen              80;
    server_name         autodrive.hugostechlab.com;
    root                /usr/share/nginx/html;
    access_log          /var/log/nginx/autodrive.hugostechlab.com.access.log;

    # Static assets cache handling
    location ~ ^/(assets|js|css|_app)/ {
        try_files $uri $uri/ =404;
    }

    # Match any 3-letter language code path dynamically (e.g. /eng, /cze, /ukr, /fra)
    location ~ ^/([a-z]{3})(?:/|$) {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri.html $uri/ /$1.html =404;
    }

    # Root location for main entry or static assets
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Custom 404 handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/html;
    }
}

server {
    listen              80;
    server_name         www.autodrive.hugostechlab.com;
    return              301 https://autodrive.hugostechlab.com$request_uri;
}

# ===== INFRASTRUCTURE =====

server {
    listen              80 default_server;
    server_name         _;
    access_log          off;

    location /ready {
        return 204;
    }

    location /nginx_status {
        stub_status on;
    }

    location / {
        return 404 "Not Found (one day this will be a nicer page)";
    }
}