# ===== AUTODRIVE =====

server {
    listen              80;
    server_name         autodrive.hugostechlab.com;
    root                /usr/share/nginx/html;
    access_log          /var/log/nginx/autodrive.hugostechlab.com.access.log;

    # Static assets: never fall back to HTML
    location ~ ^/(assets|js|css|_app)/ {
        try_files $uri $uri/ =404;
    }

    # Language routes: /eng, /cze, /ukr and their nested routes
    location ~ "^/([a-z]{2,3})(/|$)" {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires 0;

        try_files $uri $uri.html $uri/ /$1.html =404;
    }

    # Root and other static paths
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

server {
    listen              80;
    server_name         www.autodrive.hugostechlab.com;
    return              301 https://autodrive.hugostechlab.com$request_uri;
}

# ===== INFRASTRUCTURE =====

server {
    listen              80 default_server;
    server_name         _;
    access_log          off;

    location /ready {
        return 204;
    }

    location /nginx_status {
        stub_status on;
    }

    location / {
        return 404 "Not Found";
    }
}