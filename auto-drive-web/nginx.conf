# ===== AUTODRIVE =====

server {
    listen              80;
    server_name         autodrive.hugostechlab.com;
    root                /usr/share/nginx/html;
    access_log          /var/log/nginx/autodrive.hugostechlab.com.access.log;

    # Immutable build assets (returns standard 404 if missing)
    location ~ ^/(_app|assets|js|css)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Catch-all
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen              80;
    server_name         www.autodrive.hugostechlab.com;
    return              301 https://autodrive.hugostechlab.com$request_uri;
}

# ===== INFRASTRUCTURE =====

server {
    listen              80 default_server;
    server_name         _;
    access_log          off;

    location /ready {
        return 204;
    }

    location /nginx_status {
        stub_status on;
    }

    location / {
        return 404 "Not Found";
    }
}