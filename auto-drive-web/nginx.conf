# ===== AUTODRIVE =====

server {
    listen              80;
    server_name         autodrive.hugostechlab.com;
    root                /usr/share/nginx/html;
    access_log          /var/log/nginx/autodrive.hugostechlab.com.access.log;

    # Static assets cache handling
    location ~ ^/(assets|js|css)/ {
        try_files $uri $uri/ =404;
    }

    # Clean URL routing & cache prevention
    location / {
        # Redirect explicit .html requests to clean URLs (e.g. /eng.html -> /eng)
        if ($request_uri ~ ^/(.*)\.html(\?|$)) {
            return 302 /$1;
        }

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires 0;
        add_header Surrogate-Control "no-store";

        # Tries direct file, then .html file, then directory, then falls back to 404
        try_files $uri $uri.html $uri/ =404;
    }

    # Custom 404 handler
    error_page 404 /not-found/index.html;
    location = /not-found/index.html {
        internal;
        root /usr/share/nginx/html/hugostechlab.com;
    }
}

server {
    listen              80;
    server_name         www.autodrive.hugostechlab.com;
    return              301 https://autodrive.hugostechlab.com$request_uri;
}


# ===== INFRASTRUCTURE =====

server {
    listen              80 default_server;
    server_name         _;
    access_log          off;

    location /ready {
        return 204;
    }

    location /nginx_status {
        stub_status on;
    }

    location / {
        return 404 "Not Found (one day this will be a nicer page)";
    }
}