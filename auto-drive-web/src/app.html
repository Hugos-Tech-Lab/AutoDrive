<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
    <link rel="apple-touch-icon" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" sizes="64x64" href="/icon-64.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icon-120.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <title>Hugo's Tech Lab</title>
    %sveltekit.head%
  </head>

  <body>
    <div style="display: contents">%sveltekit.body%</div>

    <script>
      const theme = new URL(window.location).searchParams.get("theme");

      document.documentElement.classList.remove("light", "dark");
      document.documentElement.classList.add(theme || "light");
    </script>
  </body>
</html>
