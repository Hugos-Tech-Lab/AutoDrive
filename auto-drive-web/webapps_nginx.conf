# ===== AUTODRIVE =====

server {
  server_name           autodrive.hugostechlab.com;
  root                  /usr/share/nginx/html;
  access_log            /var/log/nginx/autodrive.hugostechlab.com.access.log;
  include               /etc/nginx/webapps_nginx_common.conf;
}

server {
  server_name           www.autodrive.hugostechlab.com;
  return                301 https://autodrive.hugostechlab.com$request_uri;
}


# ===== INFRASTRUCTURE =====
server {
  listen                80 default_server;
  server_name           _;
  access_log            off;

  location /ready {
    return 204;
  }

  location /nginx_status {
      stub_status on;
  }

  location / {
    return 404 "Not Found (one day this will be a nicer page)";
  }
}
