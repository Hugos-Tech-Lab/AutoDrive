[package]
name = "the-beginner-car-wifi-firmware"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "main"
path = "src/main.rs"
harness = false

[dependencies]
the-beginner-car-tcp-protocol = { path = "api/the-beginner-car-tcp-protocol" }
the-beginner-car-spi-protocol = { path = "../the-beginner-car-wasm-firmware/api/the-beginner-car-spi-protocol" }
auto-drive-interfaces = { path = "../../interfaces" }
common-firmware = { path = "../common-firmware" }
anyhow = "1.0.104"
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = [
    "critical-section",
    "embassy-time-driver",
    "embassy-sync",
    "std",
    "experimental",
    "alloc",
    "default",
] }
esp-idf-sys = "0.37.2"
esp-idf-hal = "0.46.2"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embedded-svc = "0.29.0"
embedded-dht-rs = { version = "0.5.0", features = ["dht11"] }
dotenvy_macro = "0.15.7"
heapless = "0.9.3"
serde = "1.0.229"
serde_json = "1.0.151"
embedded-io-async = "0.7.0"
futures-lite = { version = "2.6.1", default-features = false }
embassy-sync = { version = "0.8.0" }
futures = "0.3.34"
static_cell = "2.1.1"
flume = "0.12.0"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
crc = "3.4.0"
thiserror = "2.0.21"
async-io = "2.6.0"

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(esp_idf_app_compile_time_date)',
    'cfg(esp_idf_app_reproducible_build)',
] }
