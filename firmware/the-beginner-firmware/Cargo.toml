[package]
name = "auto-drive-the-beginner-fw"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "main"
path = "src/main.rs"
harness = false

[dependencies]
wamr-rust-sdk = { git = "https://github.com/hugosvirak/wamr-rust-sdk/", tag = "v0.0.1", default-features = false, features = ["esp-idf"] }
anyhow = "1.0.104"
# wasmtime = "48.0.1"
# wasmtime-wasi = "48.0.1"
wit-bindgen = "0.61.1"
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync", "std", "experimental", "alloc", "default"] }
esp-idf-sys = "0.37.2"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embedded-svc = "0.29.0"
embedded-dht-rs = { version = "0.5.0", features = ["dht11"] }
dotenvy_macro = "0.15.7"
heapless = "0.9.3"
serde = "1.0.229"
serde_json = "1.0.151"
ws2812-spi = { version = "0.5", features = ["mosi_idle_high"] }
smart-leds-trait = "0.3.2"
edge-http = "0.8.0"
edge-nal = "0.7.0"
embedded-io-async = "0.7.0"
futures-lite = "2.6.1"
async-io = "2.3" # Added: Required for driving async I/O sockets properly in STD
edge-nal-std = "0.7.0"
embassy-sync = { version = "0.8.0" }
futures = "0.3.34"
static_cell = "2.1.1"
flume = "0.12.0"

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(esp_idf_app_compile_time_date)',
    'cfg(esp_idf_app_reproducible_build)',
] }
